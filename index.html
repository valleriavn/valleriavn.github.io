<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" href="assets/img/logo.png" type="image/png" />
    <link rel="shortcut icon" href="assets/img/logo.png" type="image/png" />

    <meta
      name="title"
      property="og:title"
      content="Kim Verlie Vivas Napolitano"
    />
    <meta name="type" property="og:type" content="website" />
    <meta
      name="image"

      content="assets/img/profile-githubpage.png"
    />
    <meta
      name="description"
      property="og:description"
      content="Information Technology Student at Polytechnic University of the Philippines"
    />
    <link

      rel="stylesheet"

  </head>
  <body>
    <div class="container-fluid main-wrapper">
      <div class="row g-0">
        <div class="col-12 col-lg-4 profile-section fixed-profile order-lg-2">
          <div class="profile-wrapper">
            <div class="profile-card">
              <div class="profile-image-container">
                <div class="image-frame">
                  <img
                    src="assets/img/profile-githubpage.png"
                    alt="Kim Verlie Vivas Napolitano"
                    class="profile-img"
                  />
                </div>
              </div>
              <div class="profile-info">
                <h2 class="profile-name">Kim Verlie Vivas Napolitano</h2>
                <p class="profile-title">IT Student</p>
                <div class="profile-details">
                  <div class="detail-item">
                    <i class="fas fa-envelope detail-icon"></i>
                    <div>
                      <span class="detail-label">Email</span>
                      <span class="detail-value">nkimverlie@gmail.com</span>
                    </div>
                  </div>
                  <div class="detail-item">
                    <i class="fas fa-map-marker-alt detail-icon"></i>
                    <div>
                      <span class="detail-label">Location</span>
                      <span class="detail-value">Batangas, Philippines</span>
                    </div>
                  </div>
                  <div class="detail-item">
                    <i class="fas fa-phone detail-icon"></i>
                    <div>
                      <span class="detail-label">Mobile</span>
                      <span class="detail-value">+639626586206</span>
                    </div>
                  </div>
                </div>
                <div class="profile-links">
                  <a
                    href="https://linkedin.com/in/valleriavn"
                    target="_blank"
                    class="profile-link"
                  >
                    <i class="fab fa-linkedin"></i>LinkedIn
                  </a>
                  <a
                    href="https://github.com/valleriavn"
                    target="_blank"
                    class="profile-link"
                  >
                    <i class="fab fa-github"></i>GitHub
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div
          class="col-12 col-lg-8 content-section scrollable-content order-lg-1"
        >
          <div class="content-wrapper">
            <nav class="main-nav" data-aos="fade-down">
              <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon" id="themeIcon"></i>
              </button>
              <ul class="nav-list">
                <li>
                  <a
                    href="#about"
                    class="nav-link active"
                    onclick="
                      loadPage('about');
                      return false;
                    "
                    >About</a
                  >
                </li>
                <li>
                  <a
                    href="#projects"
                    class="nav-link"
                    onclick="
                      loadPage('projects');
                      return false;
                    "
                    >Projects</a
                  >
                </li>
                <li>
                  <a
                    href="#skills"
                    class="nav-link"
                    onclick="
                      loadPage('skills');
                      return false;
                    "
                    >Skills</a
                  >
                </li>
              </ul>
            </nav>
            <div id="maincontent"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="resumeModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">My Resume / CV</h5>
            <div class="d-flex gap-2">
              <a
                href="assets/docs/kim-verlie-cv.pdf"
                class="btn btn-sm btn-primary"
                download="Kim-Verlie-Napolitano-CV.pdf"
              >
                <i class="fas fa-download me-1"></i> Download PDF
              </a>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
          </div>
          <div class="modal-body p-0">
            <iframe
              src="assets/docs/CV_NAPOLITANO.pdf"
              width="100%"
              height="700px"
              style="border: none"
              title="Kim Verlie Napolitano Resume"
              id="resumeIframe"
            >
            </iframe>
          </div>
          <div class="modal-footer justify-content-start">
            <small class="text-muted"
              >For best experience, download the PDF to view all formatting
              correctly.</small
            >
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/navigate.js"></script>
    <script>
      AOS.init({ duration: 800, once: true, offset: 50 });
      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");

      function setTheme(mode) {
        if (mode === "dark") {
          document.body.classList.add("dark-mode");
          themeIcon.classList.remove("fa-moon");
          themeIcon.classList.add("fa-sun");
        } else {
          document.body.classList.remove("dark-mode");
          themeIcon.classList.remove("fa-sun");
          themeIcon.classList.add("fa-moon");
        }
      }

      function getStoredTheme() {
        try {
          return localStorage.getItem("theme") || "light";
        } catch (e) {
          try {
            return sessionStorage.getItem("theme") || "light";
          } catch (e2) {
            return "light";
          }
        }
      }

      function storeTheme(theme) {
        try {
          localStorage.setItem("theme", theme);
        } catch (e) {
          try {
            sessionStorage.setItem("theme", theme);
          } catch (e2) {}
        }
      }

      const savedTheme = getStoredTheme();
      setTheme(savedTheme);

      themeToggle.addEventListener("click", () => {
        const newTheme = document.body.classList.contains("dark-mode")
          ? "light"
          : "dark";
        storeTheme(newTheme);
        setTheme(newTheme);
      });

      window.addEventListener("DOMContentLoaded", () => {
        loadPage("about");
      });
    </script>
  </body>
</html>
